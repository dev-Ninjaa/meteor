services:
  postgres:
    image: postgres:17-alpine
    container_name: meteor-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: meteor
      POSTGRES_PASSWORD: meteor123
      POSTGRES_DB: meteor_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meteor -d meteor_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meteor-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: development
    container_name: meteor-app
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      API_PREFIX: api
      API_VERSION: 1
      DATABASE_URL: postgresql://meteor:meteor123@postgres:5432/meteor_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      MONAD_RPC_URL: https://testnet-rpc.monad.xyz
      MONAD_CHAIN_ID: 10143
      MONAD_ESCROW_CONTRACT_ADDRESS: ''
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: debug
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    healthcheck:
      test: ['CMD', 'node', '-e', '(async()=>{try{const r=await fetch("http://localhost:4000/health/live");process.exit(r.ok?0:1)}catch{process.exit(1)}})()']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
