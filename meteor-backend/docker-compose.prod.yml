services:
  postgres:
    image: postgres:17-alpine
    container_name: meteor-postgres-prod
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: meteor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meteor_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meteor -d meteor_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meteor-redis-prod
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: production
    container_name: meteor-app-prod
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api
      API_VERSION: 1
      DATABASE_URL: postgresql://meteor:${POSTGRES_PASSWORD}@postgres:5432/meteor_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      MONAD_RPC_URL: ${MONAD_RPC_URL}
      MONAD_CHAIN_ID: ${MONAD_CHAIN_ID}
      MONAD_ESCROW_CONTRACT_ADDRESS: ${MONAD_ESCROW_CONTRACT_ADDRESS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      PINATA_API_KEY: ${PINATA_API_KEY}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY}
      PINATA_JWT: ${PINATA_JWT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
    healthcheck:
      test: ['CMD', 'node', '-e', '(async()=>{try{const r=await fetch("http://localhost:4000/health/live");process.exit(r.ok?0:1)}catch{process.exit(1)}})()']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: